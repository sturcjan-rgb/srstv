  :root{
    --bg:#3b3d3f;
    --card:#1a1a1d;
    --card-hover:#212124;
    --line:#2a2a2e;
    --gold:#ffd21a;
    --gold-dim:#8a6f22;
    --text:#f2f2f0;
    --text-dim:#9a9a9e;

    --fs-date:13px;
    --fs-date-day:14px;
    --fs-teams:19px;
    --fs-phase:12px;
    --fs-tag:12.5px;
    --fs-btn:14px;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  .stripes{height:6px;width:100%;background:repeating-linear-gradient(135deg,var(--gold) 0 22px,#111 22px 44px);}
  header{position:sticky;top:0;z-index:50;background:rgba(59,61,63,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .nav{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  .brand-logo svg{height:40px;width:auto;display:block;}
  nav.links{display:flex;align-items:center;gap:24px;font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;}
  nav.links a:hover{color:var(--gold);}

  main{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}

  .section-title{display:flex;align-items:center;gap:10px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin:36px 0 14px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .section-title:first-child{margin-top:0;}
  .dot-live{width:8px;height:8px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 4px rgba(229,72,77,0.18);}

  /* ---- featured hero match ---- */
  .hero-match{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .hero-match:hover{border-color:var(--gold-dim);}
  .hero-thumb{
    position:relative;
    min-height:260px;
    background:
      radial-gradient(120% 140% at 20% 15%, rgba(255,210,26,0.16) 0%, transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 26px, transparent 26px 52px),
      #101012;
    display:flex;align-items:center;justify-content:center;
  }
  .play-badge{
    width:72px;height:72px;border-radius:50%;
    background:var(--gold);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .play-badge svg{width:26px;height:26px;fill:#141414;margin-left:4px;}
  .hero-info{padding:32px 30px;display:flex;flex-direction:column;justify-content:center;}
  .hero-eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-dim);margin-bottom:14px;}
  .hero-tags{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .hero-opponent{
    font-family:"CoFo Peshka Black","Barlow Condensed",sans-serif;font-weight:900;
    font-size:38px;line-height:1.05;margin:0 0 12px;color:var(--text);
  }
  .hero-meta{font-size:14px;color:var(--text-dim);margin-bottom:22px;}
  .hero-meta b{color:var(--text);font-weight:600;}
  .btn-play-lg{
    align-self:flex-start;
    display:inline-flex;align-items:center;gap:9px;
    background:var(--gold);color:#141414;font-weight:700;font-size:14px;
    padding:12px 20px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;
  }
  .btn-play-lg svg{width:13px;height:13px;fill:#141414;}

  /* ---- 3-card row ---- */
  .cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .match-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .match-card:hover{background:var(--card-hover);border-color:var(--gold-dim);}
  .card-top{display:flex;align-items:center;justify-content:space-between;}
  .card-date{font-size:var(--fs-date);color:var(--text-dim);}
  .card-opponent{font-family:"CoFo Peshka Black","Barlow Condensed",sans-serif;font-size:18px;font-weight:900;color:var(--text);line-height:1.2;}
  .card-phase{font-size:var(--fs-phase);color:var(--text-dim);}
  .card-action{margin-top:auto;}

  /* ---- tags shared ---- */
  .tag-home, .tag-away{font-size:var(--fs-tag);font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:5px;display:inline-block;}
  .tag-home{background:rgba(255,210,26,0.16);color:var(--gold);}
  .tag-away{background:rgba(255,255,255,0.08);color:var(--text-dim);}

  .btn-play{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:#141414;font-weight:700;font-size:var(--fs-btn);padding:8px 14px;border-radius:8px;border:none;font-family:inherit;}
  .btn-play svg{width:11px;height:11px;fill:#141414;}
  .btn-soon{font-size:var(--fs-btn);color:var(--text-dim);background:transparent;border:1px solid var(--line);padding:8px 12px;border-radius:8px;display:inline-block;}

  /* ---- filters + list (stejné jako současný web) ---- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .filter-toggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px;}
  .filter-btn{background:transparent;border:none;color:var(--text-dim);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;font-family:inherit;cursor:pointer;}
  .filter-btn.active{background:var(--gold);color:#141414;}
  .filter-select{background:var(--card);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 12px;border-radius:9px;font-family:inherit;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--text-dim);stroke-width:2;}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 12px 9px 34px;border-radius:9px;font-family:inherit;}
  .search-wrap input::placeholder{color:var(--text-dim);}
  .results-count{font-size:12px;color:var(--text-dim);margin:-4px 0 14px;}

  .match-list{display:flex;flex-direction:column;gap:8px;}
  .match{display:grid;grid-template-columns:100px 1fr 110px 140px;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;transition:background .15s ease, border-color .15s ease;}
  .match.playable{cursor:pointer;}
  .match.playable:hover{background:var(--card-hover);border-color:var(--gold-dim);}
  .m-date{font-size:var(--fs-date);color:var(--text-dim);line-height:1.3;}
  .m-date b{display:block;color:var(--text);font-size:var(--fs-date-day);}
  .m-teams{font-size:var(--fs-teams);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .opp-name{font-family:"CoFo Peshka Black","Barlow Condensed",sans-serif;font-weight:900;}
  .m-phase{font-size:var(--fs-phase);color:var(--text-dim);text-align:right;}
  .m-action{display:flex;justify-content:flex-end;}

  .empty-box{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--text-dim);font-size:14px;background:var(--card);}

  footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--text-dim);font-size:12px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.open{display:flex;}
  .player{width:100%;max-width:920px;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .player-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);}
  .player-head h3{margin:0;font-size:15px;font-weight:700;}
  .player-head .close{cursor:pointer;color:var(--text-dim);font-size:20px;line-height:1;background:none;border:none;}
  .player-head .close:hover{color:var(--gold);}
  .video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  @media (max-width:800px){
    .hero-match{grid-template-columns:1fr;}
    .hero-thumb{min-height:180px;}
    .cards-row{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .match{grid-template-columns:1fr;gap:6px;text-align:left;}
    .m-phase{text-align:left;}
    .m-action{justify-content:flex-start;}
    nav.links{display:none;}
  }
</style>

<script>
let matches = [];

const PLAY_ICON = `<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6V2z"/></svg>`;
const state = { loc: "all", phase: "all", q: "" };

// Kolik hodin po výskoku ještě považujeme zápas za "živě" (rozcvička +
// 4 čtvrtiny + přestávky + případný nastavovaný čas na dojezd přenosu).
const LIVE_WINDOW_HOURS = 3;
const PRE_SHOW_MINUTES = 15;

function opponentOf(m){ return m.us === "home" ? m.away : m.home; }
function tagOf(m){ return m.us === "home" ? `<span class="tag-home">DOMA</span>` : `<span class="tag-away">VENKU</span>`; }

function parseStart(m){
  const [d, mo, y] = m.date.split(".").map(s => parseInt(s.trim(), 10));
  const [hh, mm] = m.time.split(":").map(Number);
  return new Date(y, mo - 1, d, hh, mm);
}

function statusOf(m, now){
  const start = parseStart(m);
  const liveFrom = new Date(start.getTime() - PRE_SHOW_MINUTES * 60000);
  const liveUntil = new Date(start.getTime() + LIVE_WINDOW_HOURS * 3600000);
  if(now >= liveFrom && now <= liveUntil) return "live";
  if(now < liveFrom) return "upcoming";
  return "past";
}

// Vybere, co se ukáže jako hlavní karta: živý zápas > nejbližší naplánovaný > poslední odehraný.
function pickFeatured(withStatus){
  const live = withStatus.find(m => m.status === "live");
  if(live) return live;
  const upcoming = withStatus.filter(m => m.status === "upcoming").sort((a, b) => a.start - b.start);
  if(upcoming.length) return upcoming[0];
  const past = withStatus.filter(m => m.status === "past").sort((a, b) => b.start - a.start);
  return past[0] || null;
}

function renderHero(featured){
  const titleEl = document.getElementById("heroSectionTitle");
  const el = document.getElementById("heroMatch");

  if(!featured){
    titleEl.textContent = "Zápasy";
    el.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">Zatím žádné zápasy k zobrazení.</div>`;
    return;
  }

  const m = featured;
  el.onclick = null;

  if(m.status === "live"){
    titleEl.innerHTML = `<span class="dot-live"></span> Živě`;
    const playable = !!m.embed;
    if(playable) el.onclick = () => openPlayer(m._i);
    el.innerHTML = `
      <div class="hero-thumb"><div class="play-badge">${PLAY_ICON}</div></div>
      <div class="hero-info">
        <div class="hero-eyebrow">Právě se hraje · ${m.phase}</div>
        <div class="hero-tags">${tagOf(m)}</div>
        <h2 class="hero-opponent">${opponentOf(m)}</h2>
        <div class="hero-meta">Výskok <b>${m.time}</b> · ${m.date}</div>
        ${playable
          ? `<button class="btn-play-lg" type="button">${PLAY_ICON}Sledovat živě</button>`
          : `<span class="btn-soon">Přenos se spouští, chvíli strpení…</span>`}
      </div>`;
    return;
  }

  if(m.status === "upcoming"){
    titleEl.textContent = "Nejbližší zápas";
    const playable = !!m.embed; // pro případ, že by tvcom embed zveřejnil dřív
    if(playable) el.onclick = () => openPlayer(m._i);
    el.innerHTML = `
      <div class="hero-thumb"><div class="play-badge">${PLAY_ICON}</div></div>
      <div class="hero-info">
        <div class="hero-eyebrow">${m.phase}</div>
        <div class="hero-tags">${tagOf(m)}</div>
        <h2 class="hero-opponent">${opponentOf(m)}</h2>
        <div class="hero-meta">Výskok <b>${m.time}</b> · ${m.date}</div>
        ${playable
          ? `<button class="btn-play-lg" type="button">${PLAY_ICON}Přehrát</button>`
          : `<span class="btn-soon">Zápas ještě nezačal</span>`}
      </div>`;
    return;
  }

  // past
  titleEl.textContent = "Poslední zápas";
  const playable = !!m.embed;
  if(playable) el.onclick = () => openPlayer(m._i);
  el.innerHTML = `
    <div class="hero-thumb"><div class="play-badge">${PLAY_ICON}</div></div>
    <div class="hero-info">
      <div class="hero-eyebrow">${m.phase}</div>
      <div class="hero-tags">${tagOf(m)}</div>
      <h2 class="hero-opponent">${opponentOf(m)}</h2>
      <div class="hero-meta"><b>${m.date}</b> · ${m.time}</div>
      ${playable
        ? `<button class="btn-play-lg" type="button">${PLAY_ICON}Přehrát záznam</button>`
        : `<span class="btn-soon">Zatím bez videa</span>`}
    </div>`;
}

function renderCards(featured, withStatus){
  const row = document.getElementById("cardsRow");

  // Zbytek seřazený tak, aby dávalo smysl v čase: napřed to, co teprve
  // přijde (nejbližší napřed), pak to, co už proběhlo (nejnovější napřed).
  const rest = withStatus.filter(m => m !== featured).sort((a, b) => {
    const rank = s => (s === "upcoming" ? 0 : 1);
    const ra = rank(a.status), rb = rank(b.status);
    if(ra !== rb) return ra - rb;
    return a.status === "upcoming" ? a.start - b.start : b.start - a.start;
  });

  const cardMatches = rest.slice(0, 3);
  window.__srsniListRest = rest.slice(3); // zbytek jde do seznamu níž

  row.innerHTML = cardMatches.map((m) => {
    const playable = !!m.embed;
    const action = m.status === "upcoming"
      ? (playable ? `<button class="btn-play" type="button">${PLAY_ICON}Přehrát</button>` : `<span class="btn-soon">nezačalo</span>`)
      : (playable ? `<button class="btn-play" type="button">${PLAY_ICON}Přehrát</button>` : `<span class="btn-soon">bez videa</span>`);
    return `
      <div class="match-card" ${playable ? `onclick="openPlayer(${m._i})"` : ""}>
        <div class="card-top"><span class="card-date">${m.date} · ${m.time}</span>${tagOf(m)}</div>
        <div class="card-opponent">${opponentOf(m)}</div>
        <div class="card-phase">${m.phase}</div>
        <div class="card-action">${action}</div>
      </div>`;
  }).join("");
}

function uniquePhases(rest){
  const seen = new Set(); const order = [];
  rest.forEach(m => { if(!seen.has(m.phase)){ seen.add(m.phase); order.push(m.phase); } });
  return order;
}
function populatePhaseSelect(rest){
  const sel = document.getElementById("phaseSelect");
  sel.innerHTML = `<option value="all">Všechny fáze</option>`;
  uniquePhases(rest).forEach(p => {
    const opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
}
function passesFilter(m){
  if(state.loc !== "all" && m.us !== state.loc) return false;
  if(state.phase !== "all" && m.phase !== state.phase) return false;
  if(state.q){
    const opp = opponentOf(m).toLowerCase();
    if(!opp.includes(state.q)) return false;
  }
  return true;
}
function renderList(){
  const list = document.getElementById("matchList");
  const rest = window.__srsniListRest || [];
  const rows = rest.filter(passesFilter);

  document.getElementById("resultsCount").textContent =
    rows.length === rest.length ? `${rest.length} zápasů` : `${rows.length} z ${rest.length} zápasů`;

  if(rows.length === 0){
    list.innerHTML = `<div class="empty-box">Žádný zápas neodpovídá filtru.</div>`;
    return;
  }
  list.innerHTML = rows.map((m) => {
    const playable = !!m.embed;
    const action = playable
      ? `<button class="btn-play" type="button">${PLAY_ICON}Přehrát</button>`
      : `<span class="btn-soon">bez videa</span>`;
    return `
      <div class="match ${playable ? 'playable' : ''}" ${playable ? `onclick="openPlayer(${m._i})"` : ""}>
        <div class="m-date"><b>${m.date}</b>${m.time}</div>
        <div class="m-teams">${tagOf(m)}<span class="opp-name">${opponentOf(m)}</span></div>
        <div class="m-phase">${m.phase}</div>
        <div class="m-action">${action}</div>
      </div>`;
  }).join("");
}

function openPlayer(i){
  const m = matches[i];
  if(!m.embed) return;
  document.getElementById("playerTitle").textContent = `${m.home} – ${m.away} · ${m.date}`;
  document.getElementById("playerFrame").src = `https://embed.tvcom.cz/${m.embed}/`;
  document.getElementById("overlay").classList.add("open");
}
function closePlayer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("playerFrame").src = "";
}
document.getElementById("overlay").addEventListener("click", (e) => { if(e.target.id === "overlay") closePlayer(); });

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.loc = btn.dataset.loc;
    renderList();
  });
});
document.getElementById("phaseSelect").addEventListener("change", (e) => { state.phase = e.target.value; renderList(); });
document.getElementById("searchInput").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); renderList(); });

async function loadMatches(){
  const heroEl = document.getElementById("heroMatch");
  heroEl.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">Načítám zápasy…</div>`;
  try {
    const res = await fetch("data/matches.json", { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    matches = await res.json();
  } catch(err) {
    console.error("Nepodařilo se načíst data/matches.json:", err);
    heroEl.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">Data zápasů se nepodařilo načíst. Zkuste stránku znovu načíst za chvíli.</div>`;
    return;
  }

  const now = new Date();
  const withStatus = matches.map((m, i) => ({ ...m, _i: i, start: parseStart(m), status: statusOf(m, now) }));

  const featured = pickFeatured(withStatus);
  renderHero(featured);
  renderCards(featured, withStatus);
  populatePhaseSelect(window.__srsniListRest || []);
  renderList();
}

loadMatches();
</script>

</body>
</html>
