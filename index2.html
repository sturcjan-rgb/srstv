<html lang="cs">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sršni TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3b3d3f;
    --bg-alt:#151517;
    --card:#1a1a1d;
    --card-hover:#212124;
    --line:#2a2a2e;
    --gold:#ffcd19;
    --gold-dim:#8a6f22;
    --text:#f2f2f0;
    --text-dim:#9a9a9e;
    --away:#6b7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  .stripes{
    height:6px;
    width:100%;
    background:repeating-linear-gradient(135deg,var(--gold) 0 22px,#111 22px 44px);
  }

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(59,61,63,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1100px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo svg{height:46px;width:auto;display:block;}
  .brand-sub{font-size:11px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  nav.links{display:flex;align-items:center;gap:24px;font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;}
  nav.links a:hover{color:var(--gold);}
  nav.links .live-tag{font-weight:800;color:var(--text);}
  nav.links .live-tag::before{
    content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#e5484d;margin-right:6px;box-shadow:0 0 0 3px rgba(229,72,77,0.18);
  }

  /* hero with photo */
  .hero-photo{
    position:relative;
    overflow:hidden;
    min-height:480px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid var(--line);
  }

  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(12,12,13,0.05) 0%, rgba(12,12,13,0.18) 55%, rgba(12,12,13,0.72) 100%);
  }
  .hero-inner{
    position:relative;
    width:100%;
    max-width:820px;
    margin:0 auto;
    padding:40px 24px;
    display:flex;
    justify-content:center;
  }
  .hero-inner svg{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 8px 28px rgba(0,0,0,0.75));
  }

  main{max-width:1100px;margin:0 auto;padding:20px 20px 80px;}

  .section-title{
    display:flex;align-items:center;gap:10px;
    font-size:13px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--text-dim);margin:34px 0 14px;
  }
  .section-title::after{
    content:"";flex:1;height:1px;background:var(--line);
  }
  .dot-live{
    width:8px;height:8px;border-radius:50%;background:#e5484d;
    box-shadow:0 0 0 4px rgba(229,72,77,0.18);
  }

  .empty-box{
    border:1px dashed var(--line);border-radius:12px;
    padding:24px;text-align:center;color:var(--text-dim);font-size:14px;
    background:var(--bg-alt);
  }

  /* filters */
  .filter-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin-bottom:16px;
  }
  .filter-toggle{
    display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:4px;
  }
  .filter-btn{
    background:transparent;border:none;color:var(--text-dim);
    font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;
    cursor:pointer;font-family:inherit;
  }
  .filter-btn.active{background:var(--gold);color:#141414;}
  .filter-select{
    background:var(--card);border:1px solid var(--line);color:var(--text);
    font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;font-family:inherit;
  }
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;fill:none;stroke:var(--text-dim);stroke-width:2;
  }
  .search-wrap input{
    width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);
    font-size:13px;padding:9px 12px 9px 34px;border-radius:9px;font-family:inherit;
  }
  .search-wrap input::placeholder{color:var(--text-dim);}
  .search-wrap input:focus, .filter-select:focus{outline:1px solid var(--gold-dim);}
  .results-count{font-size:12px;color:var(--text-dim);margin:-4px 0 14px;}

  .match-list{display:flex;flex-direction:column;gap:8px;}
  .match{
    display:grid;
    grid-template-columns:100px 1fr 110px 140px;
    align-items:center;gap:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    transition:background .15s ease, border-color .15s ease;
  }
  .match.playable{cursor:pointer;}
  .match.playable:hover{background:var(--card-hover);border-color:var(--gold-dim);}

  .m-date{font-size:13px;color:var(--text-dim);line-height:1.3;}
  .m-date b{display:block;color:var(--text);font-size:14px;}

  .m-teams{font-size:18.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .m-teams .vs{color:var((--gold);font-weight:400;}
  .m-teams .us{color:var(--gold);}
  .tag-home, .tag-away{
    font-size:10px;font-weight:700;letter-spacing:0.5px;
    padding:2px 6px;border-radius:4px;margin-right:6px;
  }
  .tag-home{background:rgba(246,199,68,0.15);color:var(--gold);}
  .tag-away{background:rgba(255,255,255,0.08);color:var(--text-dim);}

  .m-phase{font-size:12px;color:var(--text-dim);text-align:right;}

  .m-action{display:flex;justify-content:flex-end;}
  .btn-play{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--gold);color:#141414;
    font-weight:700;font-size:13px;
    padding:8px 14px;border-radius:8px;border:none;
    white-space:nowrap;
  }
  .btn-play svg{width:12px;height:12px;fill:#141414;}
  .btn-soon{
    font-size:12px;color:var(--text-dim);
    background:transparent;border:1px solid var(--line);
    padding:8px 12px;border-radius:8px;white-space:nowrap;
  }

  footer{
    border-top:1px solid var(--line);
    padding:26px 20px;text-align:center;
    color:var(--text-dim);font-size:12px;
  }

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.82);
    display:none;align-items:center;justify-content:center;z-index:100;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .player{
    width:100%;max-width:920px;
    background:#000;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);
  }
  .player-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:var(--bg-alt);
  }
  .player-head h3{margin:0;font-size:15px;font-weight:700;}
  .player-head .close{
    cursor:pointer;color:var(--text-dim);font-size:20px;line-height:1;
    background:none;border:none;
  }
  .player-head .close:hover{color:var(--gold);}
  .video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  @media (max-width:640px){
    .hero-photo h1{font-size:32px;}
    .hero-photo{padding:70px 16px 40px;}
    .match{grid-template-columns:1fr;gap:6px;text-align:left;}
    .m-phase{text-align:left;}
    .m-action{justify-content:flex-start;}
    nav.links{display:none;}
    .search-wrap{min-width:100%;order:3;}
  }
</style>
</head>

</svg></div>
</div>

<main id="zapasy">

  <div class="section-title"><span class="dot-live"></span> Živě / nejbližší</div>
  <div class="empty-box">Sezóna 2025/2026 skončila v play-off. Rozpis nové sezóny 2026/2027 se objeví, jakmile ho NBL zveřejní.</div>

  <div class="section-title">Odehrané zápasy</div>

  <div class="filter-bar">
    <div class="filter-toggle" id="locToggle">
      <button class="filter-btn active" data-loc="all" type="button">Vše</button>
      <button class="filter-btn" data-loc="home" type="button">Doma</button>
      <button class="filter-btn" data-loc="away" type="button">Venku</button>
    </div>
    <select class="filter-select" id="phaseSelect">
      <option value="all">Všechny fáze</option>
    </select>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Hledat soupeře…">
    </div>
  </div>
  <div class="results-count" id="resultsCount"></div>

  <div class="match-list" id="matchList"></div>

</main>

<footer>
  Sršni TV běží na video technologii tvcom.cz · Provozuje BK Sokol Písek – Sršni Photomate Písek
</footer>

<div class="overlay" id="overlay">
  <div class="player">
    <div class="player-head">
      <h3 id="playerTitle">Zápas</h3>
      <button class="close" onclick="closePlayer()">✕</button>
    </div>
    <div class="video-wrap">
      <iframe id="playerFrame" src="" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
// Zápasy se NEPÍŠOU sem ručně — načítají se z data/matches.json, který
// v pravidelných intervalech přepisuje scraper (viz scraper.mjs +
// .github/workflows/scrape.yml). Tenhle soubor tedy stačí nahrát na
// hosting jednou a dál se o sebe stará sám.
let matches = [];
const state = { loc: "all", phase: "all", q: "" };

function uniquePhases(){
  const seen = new Set();
  const order = [];
  matches.forEach(m => { if(!seen.has(m.phase)){ seen.add(m.phase); order.push(m.phase); } });
  return order;
}

function populatePhaseSelect(){
  const sel = document.getElementById("phaseSelect");
  uniquePhases().forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  });
}

function passesFilter(m){
  if(state.loc !== "all" && m.us !== state.loc) return false;
  if(state.phase !== "all" && m.phase !== state.phase) return false;
  if(state.q){
    const opponent = (m.us === "home" ? m.away : m.home).toLowerCase();
    if(!opponent.includes(state.q)) return false;
  }
  return true;
}

function renderMatches(){
  const list = document.getElementById("matchList");
  const rows = matches.map((m, i) => ({m, i})).filter(({m}) => passesFilter(m));

  document.getElementById("resultsCount").textContent =
    rows.length === matches.length ? `${matches.length} zápasů` : `${rows.length} z ${matches.length} zápasů`;

  if(rows.length === 0){
    list.innerHTML = `<div class="empty-box">Žádný zápas neodpovídá filtru.</div>`;
    return;
  }

  list.innerHTML = rows.map(({m, i}) => {
    const mark = m.us === "home" ? `<span class="tag-home">DOMA</span>` : `<span class="tag-away">VENKU</span>`;
    const opponent = m.us === "home" ? m.away : m.home;
    const playable = !!m.embed;
    const action = playable
      ? `<button class="btn-play" type="button"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6V2z"/></svg>Přehrát</button>`
      : `<span class="btn-soon">bez videa</span>`;
    return `
      <div class="match ${playable ? 'playable' : ''}" ${playable ? `onclick="openPlayer(${i})"` : ""}>
        <div class="m-date"><b>${m.date}</b>${m.time}</div>
        <div class="m-teams">${mark}${opponent}</div>
        <div class="m-phase">${m.phase}</div>
        <div class="m-action">${action}</div>
      </div>`;
  }).join("");
}

function openPlayer(i){
  const m = matches[i];
  if(!m.embed) return;
  document.getElementById("playerTitle").textContent = `${m.home} – ${m.away} · ${m.date}`;
  document.getElementById("playerFrame").src = `https://embed.tvcom.cz/${m.embed}/`;
  document.getElementById("overlay").classList.add("open");
}
function closePlayer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("playerFrame").src = "";
}
document.getElementById("overlay").addEventListener("click", (e) => {
  if(e.target.id === "overlay") closePlayer();
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.loc = btn.dataset.loc;
    renderMatches();
  });
});
document.getElementById("phaseSelect").addEventListener("change", (e) => {
  state.phase = e.target.value;
  renderMatches();
});
document.getElementById("searchInput").addEventListener("input", (e) => {
  state.q = e.target.value.trim().toLowerCase();
  renderMatches();
});

async function loadMatches(){
  const list = document.getElementById("matchList");
  list.innerHTML = `<div class="empty-box">Načítám zápasy…</div>`;
  try {
    const res = await fetch("data/matches.json", { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    matches = await res.json();
  } catch(err) {
    console.error("Nepodařilo se načíst data/matches.json:", err);
    list.innerHTML = `<div class="empty-box">Data zápasů se nepodařilo načíst. Zkuste stránku znovu načíst za chvíli.</div>`;
    return;
  }
  populatePhaseSelect();
  renderMatches();
}

loadMatches();
</script>

</body>
</html>
